
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Speaking Trainer</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 14px;
  font-family: Arial, sans-serif;
  background: #eef3fa;
  color: #18263d;
}
.container { max-width: 700px; margin: auto; }
header { text-align: center; margin-bottom: 24px; }
h1 { margin-bottom: 8px; }
.subtitle { color: #64748b; }
.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.stat, .card {
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 20px #0000000a;
}
.stat { padding: 16px 8px; text-align: center; }
.stat strong {
  display: block;
  font-size: 25px;
  color: #2563eb;
}
.stat small { color: #64748b; }
.card { padding: 28px; text-align: center; }
.category {
  color: #2563eb;
  font-weight: bold;
  margin-bottom: 22px;
}
.question {
  font-size: 27px;
  font-weight: bold;
  margin: 22px 0;
  line-height: 1.6;
}
.instruction { color: #64748b; }
button {
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 13px 19px;
  margin: 6px;
  font-size: 15px;
  cursor: pointer;
}
button:disabled { opacity: .5; cursor: not-allowed; }
.secondary { background: #e7edfb; color: #1946a3; }
.answerbox {
  background: #f3f7ff;
  padding: 16px;
  border-radius: 12px;
  margin-top: 20px;
  text-align: left;
  overflow-wrap: anywhere;
}
.feedback {
  margin-top: 15px;
  font-weight: bold;
  line-height: 1.6;
}
.correct { color: #15803d; }
.incorrect { color: #c2410c; }
.status {
  text-align: center;
  padding: 10px;
  color: #64748b;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="container">
  <header>
    <h1>🎓 English Speaking Trainer</h1>
    <p class="subtitle">Practice English Every Day</p>
  </header>

  <div class="stats">
    <div class="stat">
      <strong id="total">0</strong>
      <small>Questions Done</small>
    </div>
    <div class="stat">
      <strong id="correct">0</strong>
      <small>Correct</small>
    </div>
    <div class="stat">
      <strong id="accuracy">0%</strong>
      <small>Accuracy</small>
    </div>
  </div>

  <div class="card">
    <div class="category" id="category">Loading Sheet...</div>
    <div class="question" id="question">
      Connecting to Google Sheets...
    </div>
    <p class="instruction">
      Translate this Hindi sentence into English.
    </p>

    <button onclick="listenHindi()">🔊 Listen</button>
    <button id="speakBtn" onclick="startSpeaking()">
      🎤 Speak
    </button>

    <div class="answerbox">
      <b>Your Answer:</b>
      <p id="yourAnswer">Press Speak to answer.</p>
    </div>

    <div class="feedback" id="feedback"></div>

    <div id="expectedBox" class="answerbox" hidden>
      <b>Expected English:</b>
      <p id="expected"></p>
      <button class="secondary" onclick="listenEnglish()">
        🔊 Listen in English
      </button>
    </div>

    <div style="margin-top:22px">
      <button class="secondary" onclick="showAnswer()">
        Show Answer
      </button>
      <button onclick="nextQuestion()">Next Question →</button>
    </div>
  </div>

  <p class="status" id="status">Loading sentences...</p>
</div>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSI1RsARcz18Kc9h1NnJWDt8pBDf6ErBV8-bLbythiNYyMyR7-mEwj_GumzRVIB_2khhkazsIJ1EkI/pub?gid=0&single=true&output=csv";

let sentences = [];
let currentQuestion = null;
let lastIndex = -1;
let recognition = null;
let answered = false;

const $ = id => document.getElementById(id);

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;

  text = text.replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (c === ',' && !quoted) {
      row.push(cell);
      cell = "";
    } else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell);
      if (row.some(x => x.trim())) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += c;
    }
  }

  row.push(cell);
  if (row.some(x => x.trim())) rows.push(row);
  return rows;
}

async function loadSentences() {
  try {
    $("status").textContent = "Connecting to Google Sheets...";

    const response = await fetch(CSV_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const text = await response.text();
    const rows = parseCSV(text);

    if (rows.length < 2) {
      throw new Error("No sentence data found.");
    }

    const headers = rows[0].map(x => x.trim().toLowerCase());
    const hi = headers.indexOf("hindi");
    const en = headers.indexOf("english");
    const cat = headers.indexOf("category");

    if (hi < 0 || en < 0) {
      throw new Error("Hindi/English headers missing.");
    }

    sentences = rows.slice(1)
      .filter(r => r[hi]?.trim() && r[en]?.trim())
      .map(r => ({
        hindi: r[hi].trim(),
        english: r[en].trim(),
        category: cat >= 0 ? (r[cat] || "Daily") : "Daily"
      }));

    if (!sentences.length) {
      throw new Error("No valid sentences found.");
    }

    $("status").textContent =
      "✅ Connected! " + sentences.length + " sentences loaded.";

    nextQuestion();
  } catch (error) {
    $("question").textContent = "Could not load Google Sheet";
    $("category").textContent = "Connection Error";
    $("status").textContent =
      "Error: " + error.message +
      ". Check CSV publishing and browser access.";
  }
}

function nextQuestion() {
  if (!sentences.length) return;

  if (recognition) recognition.abort();
  speechSynthesis.cancel();

  let index = Math.floor(Math.random() * sentences.length);

  if (sentences.length > 1) {
    while (index === lastIndex) {
      index = Math.floor(Math.random() * sentences.length);
    }
  }

  lastIndex = index;
  currentQuestion = sentences[index];
  answered = false;

  $("category").textContent = currentQuestion.category;
  $("question").textContent = currentQuestion.hindi;
  $("yourAnswer").textContent = "Press Speak to answer.";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("expectedBox").hidden = true;
  $("speakBtn").disabled = false;
}

function speakText(text, lang) {
  if (!("speechSynthesis" in window)) {
    alert("Text-to-speech not supported.");
    return;
  }

  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = 0.85;
  speechSynthesis.speak(utterance);
}

function listenHindi() {
  if (currentQuestion) {
    speakText(currentQuestion.hindi, "hi-IN");
  }
}

function listenEnglish() {
  if (currentQuestion) {
    speakText(currentQuestion.english, "en-IN");
  }
}

function normalize(text) {
  return text.toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, "")
    .replace(/\s+/g, " ")
    .trim();
}

function showAnswer() {
  if (!currentQuestion) return;

  $("expected").textContent = currentQuestion.english;
  $("expectedBox").hidden = false;
}

function startSpeaking() {
  if (!currentQuestion || answered) return;

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    $("feedback").textContent =
      "Speech recognition is not supported in this browser.";
    return;
  }

  speechSynthesis.cancel();

  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  $("speakBtn").disabled = true;
  $("yourAnswer").textContent = "🎤 Listening... Speak now.";

  recognition.onresult = event => {
    const spoken = event.results[0][0].transcript;
    $("yourAnswer").textContent = spoken;
    evaluateAnswer(spoken);
  };

  recognition.onerror = event => {
    $("feedback").textContent =
      "Microphone error: " + event.error;
    $("yourAnswer").textContent = "Please try again.";
  };

  recognition.onend = () => {
    $("speakBtn").disabled = answered;
  };

  try {
    recognition.start();
  } catch (e) {
    $("feedback").textContent = e.message;
    $("speakBtn").disabled = false;
  }
}

function evaluateAnswer(spoken) {
  if (answered) return;
  answered = true;

  const correct =
    normalize(spoken) === normalize(currentQuestion.english);

  const feedback = $("feedback");
  feedback.className =
    "feedback " + (correct ? "correct" : "incorrect");

  feedback.textContent = correct
    ? "✅ Correct! Excellent work."
    : "🔄 Different from expected answer. Try repeating it.";

  showAnswer();

  const today = new Date().toLocaleDateString("en-CA");
  const key = "englishTrainerHistory";

  let history = [];
  try {
    history = JSON.parse(localStorage.getItem(key) || "[]");
    if (!Array.isArray(history)) history = [];
  } catch (_) {
    history = [];
  }

  history.push({
    date: today,
    question: currentQuestion.hindi,
    expected: currentQuestion.english,
    spoken: spoken,
    correct: correct
  });

  try {
    localStorage.setItem(key, JSON.stringify(history));
  } catch (_) {
    $("status").textContent =
      "Answer checked, but local history could not be saved.";
  }

  updateStats();
}

function updateStats() {
  let history = [];

  try {
    history = JSON.parse(
      localStorage.getItem("englishTrainerHistory") || "[]"
    );
    if (!Array.isArray(history)) history = [];
  } catch (_) {
    history = [];
  }

  const today = new Date().toLocaleDateString("en-CA");
  const todayHistory = history.filter(x => x.date === today);

  const total = todayHistory.length;
  const correct = todayHistory.filter(x => x.correct).length;

  $("total").textContent = total;
  $("correct").textContent = correct;
  $("accuracy").textContent =
    total ? Math.round(correct / total * 100) + "%" : "0%";
}

updateStats();
loadSentences();
</script>
</body>
</html>

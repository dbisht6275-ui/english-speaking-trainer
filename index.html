
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Speaking Trainer</title>
<style>
* {box-sizing:border-box}
body {
  font-family:Arial,sans-serif;
  background:#eef3fb;
  margin:0;
  padding:20px;
  color:#17233b;
}
.card {
  max-width:650px;
  margin:30px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 8px 30px #00000012;
}
h1 {text-align:center;color:#1d4ed8}
.subtitle {text-align:center;color:#64748b}
.stats {display:flex;gap:10px;margin:20px 0}
.stat {
  flex:1;
  background:#f1f5f9;
  padding:15px 5px;
  border-radius:12px;
  text-align:center;
}
.stat b {display:block;font-size:25px}
.question {
  background:#eff6ff;
  padding:25px;
  border-radius:15px;
  text-align:center;
  margin:20px 0;
}
#hindi {font-size:25px;line-height:1.6}
button {
  background:#2563eb;
  color:white;
  padding:13px 20px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  margin:5px;
  font-size:15px;
}
button:disabled {opacity:.5}
.green {background:#059669}
.gray {background:#475569}
.controls {text-align:center}
#answer,#feedback {
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  background:#f8fafc;
  overflow-wrap:anywhere;
}
#status {text-align:center;color:#64748b}
select {
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
}
@media(max-width:500px){
  .card {padding:16px}
  #hindi {font-size:21px}
}
</style>
</head>
<body>

<div class="card">
<h1>English Speaking Trainer</h1>
<p class="subtitle">Practice English with Hindi Sentences</p>

<div class="stats">
  <div class="stat">
    <b id="total">0</b>
    Practiced
  </div>
  <div class="stat">
    <b id="correct">0</b>
    Correct
  </div>
  <div class="stat">
    <b id="accuracy">0%</b>
    Accuracy
  </div>
</div>

<label for="category">Select Category</label>
<select id="category" onchange="nextQuestion()">
  <option value="All">All Categories</option>
</select>

<div class="question">
  <small id="questionCategory">Loading</small>
  <h2 id="hindi">Connecting to Google Sheets...</h2>
  <p>Translate into English and speak</p>
</div>

<div class="controls">
  <button onclick="listen()">🔊 Listen</button>
  <button id="speak" class="green" onclick="speak()">🎤 Speak</button>
</div>

<div id="answer">Your answer will appear here.</div>
<div id="feedback">Feedback will appear here.</div>

<div class="controls">
  <button class="gray" onclick="showAnswer()">Show Answer</button>
  <button onclick="nextQuestion()">Next Question →</button>
</div>

<p id="status"></p>
</div>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTSI1RsARcz18Kc9h1NnJWDt8pBDf6ErBV8-bLbythiNYyMyR7-mEwj_GumzRVIB_2khhkazsIJ1EkI/pub?gid=0&single=true&output=csv";

let sentences = [];
let current = null;
let recognition = null;

let history = [];
try {
  history = JSON.parse(
    localStorage.getItem("englishPractice") || "[]"
  );
  if (!Array.isArray(history)) history = [];
} catch(e) {
  history = [];
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;

  for (let i=0; i<text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (quoted && text[i+1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (c === "," && !quoted) {
      row.push(cell);
      cell = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cell);
      rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += c;
    }
  }
  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }
  return rows;
}

async function loadSentences() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(CSV_URL, {
      cache:"no-store"
    });
    if (!response.ok) throw new Error(
      "HTTP " + response.status
    );

    const csv = await response.text();
    const rows = parseCSV(csv);

    const headers = rows.shift().map(
      x => x.trim().replace(/^\uFEFF/,"")
    );

    const h = headers.indexOf("Hindi");
    const e = headers.indexOf("English");
    const c = headers.indexOf("Category");

    if (h < 0 || e < 0 || c < 0) {
      throw new Error("Required sheet headers missing");
    }

    sentences = rows.filter(
      r => r[h] && r[e]
    ).map(r => ({
      hindi:r[h].trim(),
      english:r[e].trim(),
      category:(r[c] || "Daily").trim()
    }));

    if (!sentences.length) {
      throw new Error("No sentences found");
    }

    const select = document.getElementById("category");
    [...new Set(sentences.map(s=>s.category))]
      .forEach(category=>{
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      });

    status.textContent =
      sentences.length + " sentences loaded!";
    nextQuestion();

  } catch(error) {
    document.getElementById("hindi").textContent =
      "Could not load Google Sheets";
    status.textContent =
      "Connection error: " + error.message +
      ". This may be a browser CORS restriction.";
  }
}

function nextQuestion() {
  if (!sentences.length) return;

  const category =
    document.getElementById("category").value;

  const filtered = sentences.filter(s =>
    category === "All" || s.category === category
  );

  if (!filtered.length) return;

  const choices = filtered.length > 1
    ? filtered.filter(s => s !== current)
    : filtered;

  current = choices[
    Math.floor(Math.random() * choices.length)
  ];

  document.getElementById("hindi").textContent =
    current.hindi;
  document.getElementById("questionCategory").textContent =
    current.category;
  document.getElementById("answer").textContent =
    "Your answer will appear here.";
  document.getElementById("feedback").textContent =
    "Speak your English answer.";
}

function listen() {
  if (!current) return;
  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(
    current.hindi
  );
  voice.lang = "hi-IN";
  voice.rate = 0.85;
  speechSynthesis.speak(voice);
}

function normalize(text) {
  return text.toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu,"")
    .replace(/\s+/g," ")
    .trim();
}

function speak() {
  if (!current) return;

  const SR = window.SpeechRecognition ||
             window.webkitSpeechRecognition;

  if (!SR) {
    alert("Use a supported Chrome browser.");
    return;
  }

  recognition = new SR();
  recognition.lang = "en-IN";
  recognition.interimResults = false;

  const button = document.getElementById("speak");
  button.disabled = true;

  document.getElementById("answer").textContent =
    "Listening... speak now.";

  recognition.onresult = function(event) {
    const spoken = event.results[0][0].transcript;
    checkAnswer(spoken);
  };

  recognition.onerror = function(event) {
    document.getElementById("feedback").textContent =
      "Microphone error: " + event.error;
  };

  recognition.onend = function() {
    button.disabled = false;
  };

  try {
    recognition.start();
  } catch(error) {
    button.disabled = false;
    document.getElementById("feedback").textContent =
      error.message;
  }
}

function checkAnswer(spoken) {
  if (!current) return;

  const expected = current.english;
  const correct =
    normalize(spoken) === normalize(expected);

  document.getElementById("answer").textContent =
    "You said: " + spoken;

  document.getElementById("feedback").textContent =
    (correct ? "✅ Correct!" : "❌ Not an exact match.") +
    "\nExpected Answer: " + expected;

  history.push({
    date:new Date().toISOString(),
    question:current.hindi,
    expected:expected,
    answer:spoken,
    correct:correct
  });

  try {
    localStorage.setItem(
      "englishPractice",
      JSON.stringify(history)
    );
  } catch(error) {
    document.getElementById("status").textContent =
      "Could not save progress in this browser.";
  }

  updateStats();
}

function showAnswer() {
  if (!current) return;
  document.getElementById("feedback").textContent =
    "Expected Answer: " + current.english;
}

function updateStats() {
  const total = history.length;
  const correct = history.filter(x=>x.correct).length;

  document.getElementById("total").textContent = total;
  document.getElementById("correct").textContent = correct;
  document.getElementById("accuracy").textContent =
    total ? Math.round(correct/total*100)+"%" : "0%";
}

updateStats();
loadSentences();
</script>
</body>
</html>
